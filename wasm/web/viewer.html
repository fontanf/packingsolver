<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PackingSolver viewer</title>
    <link rel="stylesheet" href="style.css">
    <!-- The figures of box and boxstacks. 'crossorigin': the page may be
         served with 'Cross-Origin-Embedder-Policy: require-corp'. -->
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.1/plotly.min.js"
            crossorigin="anonymous"></script>
    <script type="module" src="viewer-page.js"></script>
</head>
<body>
    <!-- The solution viewer: a certificate written by the solvers
         ('--certificate'), opened, dropped on the page, or given by the URL
         ('viewer.html?certificate=<URL of the certificate>', see
         'scripts/visualize.py'). -->
    <header>
        <div class="page-title">
            <h1>PackingSolver viewer</h1>
            <!-- The project, and its discussions to ask questions (icons:
                 GitHub Octicons, MIT license). In a new tab, not to leave the
                 page (e.g. during an optimization). -->
            <nav class="project-links" aria-label="PackingSolver project">
                <a class="link-button" href="https://github.com/fontanf/packingsolver" target="_blank" rel="noopener">
                    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path></svg>
                    GitHub
                </a>
                <a class="link-button" href="https://github.com/fontanf/packingsolver/discussions" target="_blank" rel="noopener">
                    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.75 1h8.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 10.25 10H7.061l-2.574 2.573A1.458 1.458 0 0 1 2 11.543V10h-.25A1.75 1.75 0 0 1 0 8.25v-5.5C0 1.784.784 1 1.75 1ZM1.5 2.75v5.5c0 .138.112.25.25.25h1a.75.75 0 0 1 .75.75v2.19l2.72-2.72a.749.749 0 0 1 .53-.22h3.5a.25.25 0 0 0 .25-.25v-5.5a.25.25 0 0 0-.25-.25h-8.5a.25.25 0 0 0-.25.25Zm13 2a.25.25 0 0 0-.25-.25h-.5a.75.75 0 0 1 0-1.5h.5c.966 0 1.75.784 1.75 1.75v5.5A1.75 1.75 0 0 1 14.25 12H14v1.543a1.458 1.458 0 0 1-2.487 1.03L9.22 12.28a.749.749 0 0 1 .326-1.275.749.749 0 0 1 .734.215l2.22 2.22v-2.19a.75.75 0 0 1 .75-.75h1a.25.25 0 0 0 .25-.25Z"></path></svg>
                    Ask a question
                </a>
            </nav>
        </div>
        <p>
            Open a solution certificate written by the solvers (<code>--certificate</code>): a CSV file,
            or a JSON file for irregular shapes. The file stays on your machine.
        </p>
        <p>
            <button type="button" id="open-file">Open a certificate</button>
            <input type="file" id="file" accept=".csv,.json,text/csv,application/json" hidden>
            <span class="note">or drop it on the page.</span>
        </p>
        <p id="error" class="note error-text" role="status"></p>
    </header>

    <main>
        <section id="solution" hidden>
            <h2 id="solution-title"></h2>
            <div id="viewer"></div>
            <!-- The plotly figures (box, boxstacks). -->
            <div id="plot"></div>
        </section>
    </main>
</body>
</html>
